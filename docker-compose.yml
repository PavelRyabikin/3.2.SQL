services:
  mysql:
    image: mysql:8.0.41
    container_name: mysql
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: pass
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: pass
    volumes:
      - ./schema/schema.sql:/docker-entrypoint-initdb.d/schema.sql